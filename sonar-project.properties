sonar.projectKey=test-vista-be
sonar.projectName=Test Vista Backend
sonar.projectVersion=1.0

sonar.host.url=${env.SONAR_HOST_URL}

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,**/*.spec.ts

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Nest compiles as CommonJS; top-level await (S7785) is not valid in this module format.
sonar.issue.ignore.multicriteria=s7785
sonar.issue.ignore.multicriteria.s7785.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.s7785.resourceKey=**/src/main.ts
